name: 每日选股推送

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - fast       # 主线+资金，不拉K线，约30秒
          - full       # 完整版：含均线多头+回马枪，约2-5分钟
          - no_fund    # 只看主线和形态，资金接口挂了时用
          - keepalive  # 仅保活，防止60天无活动被禁用
      top_n:
        description: '推送前N只'
        required: false
        default: '15'
        type: string
      date:
        description: '指定日期(YYYYMMDD)，留空=今天'
        required: false
        default: ''
        type: string
  schedule:
    # GitHub Actions 用 UTC，无时区配置。公式：北京时间 - 8 = UTC
    # 14:55 → 6:55  收盘前5分钟：板块异动速报
    - cron: '55 6 * * 1-5'
    # 15:05 → 7:05  收盘即推：抢抓封板瞬间
    - cron: '5 7 * * 1-5'
    # 16:30 → 8:30  完整复盘：含均线多头+回马枪+资金验证（主任务）
    - cron: '30 8 * * 1-5'
    # 20:00 → 12:00 二次确认：看尾盘是否炸板、封单变化
    - cron: '0 12 * * 1-5'
    # 次日 8:50 → 0:50（前一日 UTC）+ 周六 0:50 兜底，防止跨日漏跑
    - cron: '50 0 * * 1-6'

permissions:
  contents: write   # 用于 commit 回存选股结果

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 防止定时任务堆积重叠执行
    concurrency:
      group: stock-picker
      cancel-in-progress: false

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      OUTPUT_DIR: results

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas numpy
          python -c "import akshare; print('akshare', akshare.__version__)"

      - name: 判定运行模式与时段
        id: meta
        run: |
          # 非手动触发时，按 cron 时间点推断模式
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              '55 6 * * 1-5')  MODE=fast;     TAG="收盘前速报";;
              '5 7 * * 1-5')   MODE=fast;     TAG="收盘即报";;
              '30 8 * * 1-5')  MODE=full;     TAG="盘后完整复盘";;
              '0 12 * * 1-5')  MODE=no_fund;  TAG="尾盘二次确认";;
              '50 0 * * 1-6')  MODE=keepalive; TAG="保活心跳";;
              *)               MODE=fast;     TAG="未知时段-默认fast";;
            esac
          else
            MODE=${{ inputs.mode || 'full' }}
            TAG="手动触发"
          fi
          echo "mode=$MODE"     >> $GITHUB_OUTPUT
          echo "tag=$TAG"       >> $GITHUB_OUTPUT
          echo "run_id=${{ github.run_id }}" >> $GITHUB_OUTPUT
          echo "▶ 模式=$MODE | 时段=$TAG | 触发=${{ github.event_name }}"

      - name: 保活（不跑选股）
        if: steps.meta.outputs.mode == 'keepalive'
        run: |
          echo "💓 keepalive 心跳，防止定时任务被禁用"
          echo "last_run=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > keepalive.txt
          exit 0

      - name: 运行选股
        if: steps.meta.outputs.mode != 'keepalive'
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          ARGS=""
          case "${{ steps.meta.outputs.mode }}" in
            fast)     ARGS="--no-ma --top ${{ inputs.top_n || 15 }}";;
            full)     ARGS="--top ${{ inputs.top_n || 15 }}";;
            no_fund)  ARGS="--no-fund --no-ma --top ${{ inputs.top_n || 15 }}";;
          esac
          if [ -n "${{ inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.date }}"
          fi
          echo "▶ 执行: python daily_pick.py $ARGS"
          python daily_pick.py $ARGS

      - name: 回存选股结果到仓库
        if: steps.meta.outputs.mode != 'keepalive'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ keepalive.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "📭 无新结果，跳过提交"
          else
            git commit -m "chore: 选股结果 ${{ steps.meta.outputs.tag }} (${{ steps.meta.outputs.run_id }})"
            git push
          fi
